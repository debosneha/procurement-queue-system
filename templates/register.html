{% extends 'index.html' %}

{% block head %}
<title>Farmer Registration</title>
{% endblock %}

{% block body %}
<div class="container">
    <h1>Farmer Registration</h1>
    <form action="/register" method="POST" class="registration-form">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="address">Village/Address:</label>
            <input type="text" id="address" name="address">
        </div>

        <div class="form-group">
            <label for="crop_type">Crop Type:</label>
            <select id="crop_type" name="crop_type" required>
                <option value="">Select a crop type</option>
                <option value="Wheat">Wheat</option>
                <option value="Rice">Rice</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity (in quintals):</label>
            <input type="number" id="quantity" name="quantity" min="0" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="center">Preferred Center:</label>
            <input type="text" id="center" name="center" required>
        </div>

        <button type="submit" class="btn-submit">Register</button>
    </form>
</div>
{% endblock %}
